spring.application.name=nakama-hub-backend

# Carga el fichero .env local si existe. En producción las variables llegan
# del entorno y este import simplemente no encuentra nada, que es lo esperado.
spring.config.import=optional:file:.env[.properties]

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/nakamahub
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Obliga a que el acceso a colecciones perezosas ocurra dentro de una transaccion
# del servicio. Con el valor por defecto (true) la sesion sigue abierta durante la
# vista y los fallos de carga perezosa aparecen mas tarde y en sitios peores.
spring.jpa.open-in-view=false

# No devolver el mensaje de la excepcion en la pagina de error por defecto:
# suele filtrar nombres de tablas y rutas internas. Los errores de la API los
# construye GlobalExceptionHandler.
server.error.include-message=never
server.error.include-stacktrace=never

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
# Validez del token de refresco (30 dias)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# Documentacion de la API
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Detras del proxy, la IP real del cliente llega en X-Forwarded-For. Sin esto, el
# limitador de intentos veria siempre la del proxy y contaria a todo el mundo junto.
# Solo es seguro con un proxy delante que fije esas cabeceras, como el Caddy del compose.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Estado de la aplicacion. Solo se expone health: el resto de endpoints de actuator
# publican metricas y configuracion que no deberian salir de la red interna.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# El indicador de correo intenta conectar al SMTP y, si no hay o falla, marca la
# aplicacion entera como caida. No procede: el envio ya degrada solo y la comunidad
# funciona sin correo. Sin esto, el contenedor se reiniciaria en bucle.
management.health.mail.enabled=false

# Correo. Sin spring.mail.host, MailConfig usa el envio por log en lugar de SMTP.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-responder@nakamahub.example}

# Origen publico del sitio, usado en el mapa del sitio para los buscadores
app.site-origin=${PUBLIC_ORIGIN:http://localhost:4200}

# Origenes autorizados para CORS, separados por comas
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
