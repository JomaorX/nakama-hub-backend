# Perfil de desarrollo: levanta la aplicacion sin MySQL ni fichero .env.
# Arrancar con: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# Los datos viven en memoria y se pierden al parar el proceso. No usar en produccion.

spring.datasource.url=jdbc:h2:mem:nakamahub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Secreto de juguete, valido solo para desarrollo local.
jwt.secret=desarrollo-local-no-usar-esto-jamas-en-produccion
jwt.expiration=3600000
jwt.refresh-expiration=2592000000

# Angular en ng serve y el servidor SSR
app.cors.allowed-origins=http://localhost:4200,http://localhost:4000
app.site-origin=http://localhost:4200
