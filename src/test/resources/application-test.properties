# Base de datos en memoria en modo de compatibilidad MySQL. Permite ejecutar la
# suite sin Docker ni un MySQL local, que es lo que hace falta para que los tests
# corran en cualquier máquina y en CI.
spring.datasource.url=jdbc:h2:mem:nakamahub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=clave-de-pruebas-suficientemente-larga-para-hmac256
jwt.expiration=3600000
jwt.refresh-expiration=2592000000

app.cors.allowed-origins=http://localhost:4200
app.site-origin=https://nakamahub.test
